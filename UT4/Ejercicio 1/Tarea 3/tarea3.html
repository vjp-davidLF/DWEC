<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea 3 - Posts, Comentarios y Usuarios</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
        }

        #entradas {
            max-width: 1000px;
            margin: 0 auto;
        }

        .entrada {
            background-color: #fff;
            margin-bottom: 20px;
            border-radius: 5px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .entrada > p:first-child {
            background-color: #333;
            color: white;
            padding: 15px;
            margin: 0;
            font-weight: bold;
        }

        .entrada div {
            background-color: #fffacd;
            padding: 15px;
        }

        .entrada p {
            margin: 10px 0;
            line-height: 1.6;
        }

        .entrada button {
            background-color: #4CAF50;
            color: white;
            padding: 8px 15px;
            margin: 5px 5px 5px 0;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
        }

        .entrada button:hover {
            background-color: #45a049;
        }

        .usuario {
            background-color: #e8f4f8;
            padding: 10px;
            margin-top: 10px;
            border-left: 4px solid #4CAF50;
        }

        .comentarios {
            background-color: #f0f0f0;
            padding: 10px;
            margin-top: 10px;
            border-left: 4px solid #2196F3;
        }

        .comentarios p {
            margin: 5px 0;
            font-size: 14px;
        }

        .d-none {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Tarea 3: Entradas del blog:</h1>
    <div id="entradas">
        <!-- Aquí se cargarán los posts -->
    </div>

    <script src="tarea3.js"></script>
</body>
</html>
